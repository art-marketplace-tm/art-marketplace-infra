name: art-marketplace

services:
  postgres:
    image: postgres:16-alpine
    container_name: art-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - art-net

  redis:
    image: redis:7-alpine
    container_name: art-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - art-net

  minio:
    image: minio/minio:latest
    container_name: art-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - art-net

  minio-init:
    image: minio/mc:latest
    container_name: art-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc mb --ignore-existing local/${S3_BUCKET};
      mc anonymous set download local/${S3_BUCKET};
      exit 0;
      "
    networks:
      - art-net

  backend:
    image: ghcr.io/art-marketplace-tm/art-marketplace-api:dev
    container_name: art-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Read-only docker-socket mount so the super-admin
    # System & Insights dashboard can tail container logs via
    # `docker logs`. Mounted ro to keep the blast radius
    # small — the backend can read logs and inspect
    # containers but can't start, stop, or create anything.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    networks:
      - art-net

  celery-worker:
    image: ghcr.io/art-marketplace-tm/art-marketplace-api:dev
    container_name: art-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    networks:
      - art-net

  celery-beat:
    image: ghcr.io/art-marketplace-tm/art-marketplace-api:dev
    container_name: art-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info
    networks:
      - art-net

  caddy:
    image: caddy:2-alpine
    container_name: art-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - art-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  art-net:
    driver: bridge
